services:
  - type: web
    name: kairos-backend
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    plan: free
    healthCheckPath: /up

    envVars:
      # ── Application ──────────────────────────────────────────────────────
      - key: APP_NAME
        value: "Kairos Business Group"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://kairos-backend-nste.onrender.com

      # ── Logging (stderr = visible dans Render dashboard) ─────────────────
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning

      # ── Base de données PostgreSQL (injectée par Render) ─────────────────
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: kairos-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: kairos-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: kairos-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: kairos-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: kairos-db
          property: password

      # ── Session / Cache / Queue (database, pas de Redis sur free tier) ───
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_LIFETIME
        value: "120"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database

      # ── Filesystem ───────────────────────────────────────────────────────
      - key: FILESYSTEM_DISK
        value: local

      # ── Sanctum — domaines stateful (SPA cookie auth) ────────────────────
      - key: SANCTUM_STATEFUL_DOMAINS
        value: "kairos-backend-nste.onrender.com"

      # ── CORS — origines autorisées ────────────────────────────────────────
      # Mettre "*" pour autoriser toutes les origines (app mobile Flutter)
      # ou lister les domaines séparés par des virgules
      - key: CORS_ALLOWED_ORIGINS
        value: "*"

      # ── Proxies de confiance (Render load-balancer) ──────────────────────
      - key: TRUSTED_PROXIES
        value: "*"
      - key: TRUSTED_HOSTS
        value: "kairos-backend-nste.onrender.com"

      # ── Tokens Sanctum ───────────────────────────────────────────────────
      - key: ACCESS_TOKEN_EXPIRY
        value: "15"
      - key: REFRESH_TOKEN_EXPIRY
        value: "10080"

      # ── Sécurité login ───────────────────────────────────────────────────
      - key: LOGIN_MAX_ATTEMPTS
        value: "5"
      - key: LOGIN_LOCKOUT_MINUTES
        value: "15"

      # ── Bcrypt (augmenter en prod pour ralentir les attaques) ────────────
      - key: BCRYPT_ROUNDS
        value: "12"

databases:
  - name: kairos-db
    plan: free
    databaseName: kairos_db
    user: kairos_user
