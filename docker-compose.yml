version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kairos_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - kairos_network
    depends_on:
      - postgres
      - redis

  nginx:
    image: nginx:alpine
    container_name: kairos_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - kairos_network
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    container_name: kairos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kairos_db
      POSTGRES_USER: kairos_user
      POSTGRES_PASSWORD: kairos_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kairos_network

  redis:
    image: redis:7-alpine
    container_name: kairos_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - kairos_network

networks:
  kairos_network:
    driver: bridge

volumes:
  postgres_data:
